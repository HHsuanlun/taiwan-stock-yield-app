<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股殖利率比較</title>
  <style>
    :root { --navy:#17365d; --blue:#1f4e78; --ink:#263849; --muted:#64748b; --line:#dbe5ef; --paper:#fff; --ground:#f5f8fb; --green:#14724b; --amber:#9a6700; }
    * { box-sizing:border-box; } body { margin:0; background:var(--ground); color:var(--ink); font:15px "Microsoft JhengHei", system-ui, sans-serif; }
    header { background:var(--navy); color:#fff; } .shell { max-width:1060px; margin:auto; padding:0 24px; } .top { display:flex; justify-content:space-between; align-items:center; min-height:72px; }
    h1 { font-size:22px; margin:0; letter-spacing:.02em; } .sub { font-size:13px; opacity:.76; } main { padding:30px 24px 48px; max-width:1060px; margin:auto; }
    .panel { background:var(--paper); border:1px solid var(--line); border-radius:10px; box-shadow:0 2px 8px #17365d0a; } .add { display:flex; gap:10px; padding:16px; align-items:center; }
    input { width:230px; max-width:100%; padding:10px 12px; border:1px solid #b8c7d8; border-radius:6px; font:inherit; } button { padding:10px 15px; border:0; border-radius:6px; color:#fff; background:var(--blue); font:inherit; cursor:pointer; }
    button:hover { background:var(--navy); } button.remove { color:#64748b; background:transparent; padding:4px 7px; font-size:19px; line-height:1; } .hint { color:var(--muted); font-size:13px; }
    .chips { display:flex; flex-wrap:wrap; gap:7px; padding:0 16px 16px; } .chip { display:flex; gap:6px; align-items:center; padding:5px 8px 5px 10px; color:#405468; background:#eef3f8; border-radius:20px; font-size:13px; }
    .bar { display:flex; justify-content:space-between; align-items:end; margin:28px 0 10px; } h2 { margin:0; font-size:18px; } #message { min-height:22px; color:var(--muted); font-size:13px; }
    .tablebox { overflow:auto; } table { width:100%; border-collapse:separate; border-spacing:0; min-width:780px; background:#fff; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
    th { padding:12px 14px; background:#edf3f9; color:#44576b; font-size:13px; font-weight:600; text-align:left; border-bottom:1px solid var(--line); } td { padding:14px; border-bottom:1px solid var(--line); vertical-align:middle; } tbody tr:last-child td { border-bottom:0; } tbody tr:hover { background:#fbfdff; }
    .num { text-align:right; font-variant-numeric:tabular-nums; } .company { font-weight:700; } .code { display:block; margin-top:2px; color:var(--muted); font-size:12px; font-weight:400; } .yield { color:var(--green); font-weight:800; font-size:17px; }
    .status { display:inline-block; border-radius:20px; padding:3px 7px; background:#e8f6ee; color:var(--green); font-size:12px; } .status.offline { background:#fff3d7; color:var(--amber); } .empty { padding:40px; color:var(--muted); text-align:center; }
    .chart { margin:0 0 18px; padding:20px; } .chart-title { margin:0 0 16px; font-size:15px; font-weight:700; } .bar-row { display:grid; grid-template-columns:100px 1fr 58px; align-items:center; gap:12px; margin:11px 0; } .bar-label { font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .bar-track { height:12px; overflow:hidden; background:#edf3f8; border-radius:999px; } .bar-fill { height:100%; min-width:3px; background:linear-gradient(90deg,#285f91,#4e8fc6); border-radius:999px; } .bar-value { text-align:right; color:var(--green); font-weight:700; font-variant-numeric:tabular-nums; }
    footer { margin-top:14px; color:var(--muted); font-size:12px; line-height:1.7; } @media(max-width:640px) { .shell, main { padding-left:14px; padding-right:14px; } .top { min-height:64px; } .add { flex-wrap:wrap; } input { flex:1; } }
  </style>
</head>
<body>
  <header><div class="shell top"><h1>台股殖利率比較</h1><span class="sub">現金股利／參考現價</span></div></header>
  <main>
    <section class="panel">
      <form class="add" id="addForm"><input id="code" inputmode="numeric" maxlength="6" placeholder="輸入股票代號，例如 2891" aria-label="股票代號"><button>新增股票</button><span class="hint">最多 12 檔</span></form>
      <div class="chips" id="chips"></div>
    </section>
    <div class="bar"><div><h2>殖利率比較</h2><div class="hint">依目前預估殖利率由高至低排列</div></div><div id="message"></div></div>
    <section class="panel chart" id="chart" aria-label="預估殖利率比較圖"></section>
    <div class="tablebox" id="tablebox"></div>
    <footer>預估殖利率 = 最新已公告現金股利 ÷ 參考現價。資料來自 FinMind API，僅供資訊參考，不代表保證收益或投資建議。</footer>
  </main>
  <script>
    const key = 'tw-yield-codes';
    let codes = JSON.parse(localStorage.getItem(key) || '["2891","5880","2880"]');
    const fmt = n => n == null ? '–' : Number(n).toFixed(2);
    const pct = n => n == null ? '–' : `${(Number(n) * 100).toFixed(1)}%`;
    function save() { localStorage.setItem(key, JSON.stringify(codes)); }
    function chips() { document.querySelector('#chips').innerHTML = codes.map(code => `<span class="chip">${code}<button class="remove" aria-label="移除 ${code}" data-code="${code}">×</button></span>`).join(''); }
    function table(stocks) {
      if (!stocks.length) { document.querySelector('#tablebox').innerHTML = '<div class="panel empty">請先新增股票代號。</div>'; return; }
      document.querySelector('#tablebox').innerHTML = `<table><thead><tr><th>#</th><th>公司</th><th class="num">參考現價</th><th class="num">最新現金股利</th><th class="num">目前預估殖利率</th><th class="num">近 5 年平均</th><th>資料狀態</th></tr></thead><tbody>${stocks.map((stock, index) => `<tr><td>${index + 1}</td><td class="company">${stock.name}<span class="code">${stock.code}｜${stock.issueYear} 年發放</span></td><td class="num">${fmt(stock.price)}</td><td class="num">${fmt(stock.cashDividend)}</td><td class="num yield">${pct(stock.estimatedYield)}</td><td class="num">${pct(stock.fiveYearYield)}</td><td><span class="status ${stock.offline ? 'offline' : ''}">${stock.offline ? '離線初始資料' : '已更新'}</span></td></tr>`).join('')}</tbody></table>`;
    }
    function chart(stocks) {
      const target = document.querySelector('#chart');
      if (!stocks.length) { target.style.display = 'none'; return; }
      const maximum = Math.max(...stocks.map(stock => Number(stock.estimatedYield || 0)), 0.01);
      target.style.display = 'block';
      target.innerHTML = `<p class="chart-title">目前預估殖利率比較</p>${stocks.map(stock => { const width = Math.max((Number(stock.estimatedYield || 0) / maximum) * 100, 2); return `<div class="bar-row"><span class="bar-label">${stock.code} ${stock.name}</span><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><span class="bar-value">${pct(stock.estimatedYield)}</span></div>`; }).join('')}`;
    }
    async function refresh() {
      chips(); const message = document.querySelector('#message');
      if (!codes.length) { table([]); chart([]); message.textContent = ''; return; }
      message.textContent = '更新資料中…';
      try { const response = await fetch(`/api/stocks?codes=${codes.join(',')}`); const data = await response.json(); if (!response.ok) throw new Error(data.error || '查詢失敗'); chart(data.stocks); table(data.stocks); message.textContent = data.errors.length ? `${data.errors.length} 檔無法取得資料` : `已更新 ${data.stocks.length} 檔`; }
      catch (error) { message.textContent = error.message; }
    }
    document.querySelector('#addForm').addEventListener('submit', event => { event.preventDefault(); const input = document.querySelector('#code'); const code = input.value.trim(); if (!/^\d{4,6}$/.test(code)) { input.focus(); return; } if (!codes.includes(code) && codes.length < 12) { codes.push(code); save(); refresh(); } input.value = ''; });
    document.querySelector('#chips').addEventListener('click', event => { const code = event.target.dataset.code; if (code) { codes = codes.filter(item => item !== code); save(); refresh(); } });
    refresh();
  </script>
</body>
</html>
