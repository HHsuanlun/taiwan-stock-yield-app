services:
  - type: web
    name: taiwan-stock-yield-app
    runtime: python
    plan: free
    startCommand: python stock_yield_app.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
  - type: web
    name: taiwan-stock-valuation
    runtime: python
    plan: free
    rootDir: stock-valuation
    buildCommand: echo No build required
    startCommand: python run_local.py
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
